<div class="px-6 py-12 bg-white w-[1440px] mx-auto">
  <div class=" flex flex-col gap-2 items-center h-[250px] justify-center">
    <p class="text-[#EE5544] font-medium text-[16px]">News</p>
    <h1 class="text-[48px] font-medium " style="letter-spacing: 0%;">In the News</h1>

  </div>
  <h2 class="text-[48px] font-semibold mb-8">Latest News</h2>

  <div class="grid md:grid-cols-2 gap-8">
    <div class="space-y-4">
      <img src="assets/image1.png" alt="Health Insurance" class="rounded-lg w-full h-[331px] w-[588px] object-cover" />
      <div>
        <div class=" bg-[#FEF3F2] rounded-full w-[200px] py-1 px-2">
          <p class="text-sm text-[#EE5544] font-medium ml-[5px]">Wisconsin State Journal</p>
        </div>
        <h3 class="text-[18px] font-semibold">Madison hospitals are ignoring medical debt problem, advocate say</h3>
        <p class="text-gray-500 text-sm mt-1">20 December, 2024</p>
      </div>
    </div>

    <div class="space-y-6">
      <div *ngFor="let item of newsItems" class="flex gap-4">
        <img [src]="item.image" alt="News Image" class="h-[128px] w-[228px] object-cover rounded-md" />
        <div class="flex flex-col justify-between">
          <span class="flex flex-col gap-2">
            <span >
              <span class="text-sm text-red-500 font-medium bg-[#FEF3F2] rounded-full py-1 px-2">{{ item.source }}</span>            
              </span>
              <h4 class="text-[18px] font-semibold leading-snug">{{ item.title }}</h4>
          </span>
          <p class="text-gray-500 text-xs">{{ item.date }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
