<div class="px-8 py-6 w-[1440px] mx-auto">
  <div class="flex w-100 justify-between">
    <h2 class="text-3xl font-semibold mb-6">All News</h2>
  
    <!-- Search Input -->
    <div class="relative mb-6">
      <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2"
          viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M21 21l-4.35-4.35M16.65 16.65A7.5 7.5 0 1 0 9 16.5a7.5 7.5 0 0 0 7.65-7.65z" />
        </svg>
      </span>
      <input
        type="text"
        [(ngModel)]="searchTerm"
        placeholder="Search by title or writer"
        class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-red-500 text-sm placeholder-gray-400"
      />
    </div>
  </div>
  
    <!-- News List -->
    <div *ngFor="let item of filteredNews" class="border-b pb-4 mb-4">
      <div class="mb-1">
        <span class="inline-block bg-red-100 text-red-500 text-xs px-3 py-1 rounded-full">
          {{ item.source }}
        </span>
      </div>
      <div class="text-gray-800 font-medium">{{ item.title }}</div>
      <div class="text-gray-500 text-sm mt-1 flex items-center gap-1">
        <span class="material-icons text-sm">event</span> {{ item.date }}
      </div>
    </div>
  
    <button class="mt-6 px-5 py-2 bg-red-500 text-white rounded-full text-sm hover:bg-red-600">
      Load more
    </button>
  </div>
