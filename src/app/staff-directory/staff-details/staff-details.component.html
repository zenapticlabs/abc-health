<div class="max-w-[1440px] mx-auto p-16">
    <div *ngFor="let company of companyList " class="ml-[20px]">
      <!-- Company Name -->
      <h2 class="text-[#EE5544] font-semibold text-[28px] mb-2">{{ company.name }}</h2>
      <hr class="border-[#FEE4E2] mb-4" />
  
      <!-- Staff Cards -->
      <div class="flex flex-wrap gap-6 justify-start mb-10">
        <div
          *ngFor="let staff of company.staffList"
          class="relative w-[410px]  rounded-[12px] overflow-hidden group bg-white shadow-md"
        >
          <!-- Default View -->
          <div class="w-full h-full">
            <img
              [src]="staff.image"
              alt="{{ staff.name }}"
              class="w-full h-[300px] object-cover"
            />
            <div class="p-4 bg-white">
              <h3 class="font-semibold text-gray-800 text-[16px] leading-tight">{{ staff.name }}</h3>
              <p class="text-gray-600 text-[14px]">{{ staff.role }}</p>
              <p class="text-gray-500 text-[14px]">{{ staff.phone }}</p>
            </div>
          </div>
  
          <!-- Hover Overlay -->
          <div
            class="absolute inset-0 opacity-0 group-hover:opacity-100 transition-opacity duration-300 z-10"
          >
            <!-- Blurred Background -->
            <img
              [src]="staff.image"
              alt="{{ staff.name }}"
              class="absolute inset-0 w-full h-full object-cover blur-sm z-0"
            />
  
            <!-- Overlay Color -->
            <div class="absolute inset-0 bg-[#FEF3F2E5] z-10"></div>
  
            <!-- Overlay Content -->
            <div class="relative z-20 p-4 h-full overflow-y-auto scroll-custom">
              <h3 class="font-semibold text-gray-800 text-[16px] mb-1">{{ staff.name }}</h3>
              <p class="text-gray-600 text-[14px]">{{ staff.role }}</p>
              <p class="text-gray-500 text-[14px] mb-2">{{ staff.phone }}</p>
              <p class="text-gray-700 text-[13px] leading-snug">{{ staff.description }}</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
